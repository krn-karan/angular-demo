<div class="container mt-5">
  <button class="btn btn-primary fun-button" (click)="openPopup()">🚀 Add Ethereum User</button>

  <!-- Popup -->
  <div *ngIf="isPopupOpen" class="popup">
    <div class="popup-content">
      <h2>📝 Add Ethereum User</h2>
      
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label>Name:</label>
          <input type="text" class="form-control" formControlName="Name">
        </div>

        <div class="mb-3">
          <label>Email:</label>
          <input type="email" class="form-control" formControlName="Email">
        </div>

        <div class="mb-3">
          <label>Ethereum Address:</label>
          <input type="text" class="form-control" formControlName="EthAddress">
        </div>

        <div class="mb-3">
          <label>Balance:</label>
          <input type="number" class="form-control" formControlName="Balance">
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" formControlName="IsActive">
          <label class="form-check-label">Is Active</label>
        </div>

        <button type="submit" class="btn btn-success">💾 Save</button>
        <button type="button" class="btn btn-danger" (click)="onCancel()">❌ Cancel</button>
      </form>
    </div>
  </div>

  <!-- User Table -->
  <table class="table mt-3" *ngIf="usersList.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Ethereum Address</th>
        <th>Balance</th>
        <th>Is Active</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of usersList">
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>  <!-- ✅ Change Name → name -->
        <td>{{ user.email }}</td>  <!-- ✅ Change Email → email -->
        <td>{{ user.ethAddress }}</td>  <!-- ✅ Change EthAddress → ethAddress -->
        <td>{{ user.balance }}</td>  <!-- ✅ Change Balance → balance -->
        <td>{{ user.isActive ? 'Yes' : 'No' }}</td>  <!-- ✅ Change IsActive → isActive -->
      </tr>
    </tbody>
  </table>
</div>
