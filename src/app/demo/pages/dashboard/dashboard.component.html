<mat-card appearance="outlined">
  <mat-card-header class="header">
    <mat-card-title class="medium-font bold">Users List</mat-card-title>
    <button mat-stroked-button class="header-button" (click)="openPopup()">Add Ethereum User</button>
  </mat-card-header>
  <mat-card-actions>
    <mat-divider></mat-divider>
    <!-- Dynamic Material Table -->
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let user"> {{user.id}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let user"> {{user.name}} </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let user"> {{user.email}} </td>
      </ng-container>

      <!-- Ethereum Address Column -->
      <ng-container matColumnDef="ethAddress">
        <th mat-header-cell *matHeaderCellDef> ethAddress </th>
        <td mat-cell *matCellDef="let user"> {{user.ethAddress}} </td>
      </ng-container>

      <!-- Balance Column -->
      <ng-container matColumnDef="balance">
        <th mat-header-cell *matHeaderCellDef> Balance </th>
        <td mat-cell *matCellDef="let user"> {{user.balance}} </td>
      </ng-container>

      <!-- Is Active Column -->
      <ng-container matColumnDef="Hash">
        <th mat-header-cell *matHeaderCellDef> Hash </th>
        <td mat-cell *matCellDef="let user"> {{user.hash}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-actions>
</mat-card>

<div class="container">
  <!-- Popup -->
  <div *ngIf="isPopupOpen" class="popup col-4">
    <div class="popup-content">
      <!-- Transaction Header (added) -->
      <div class="transaction-header">
        <p>🔄 Transaction</p>
      </div>

      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        
        <!-- Select Users Field -->
        <div class="mb-3">
          <label for="userSelect">Select Users</label>
          <select class="form-control" formControlName="Id" id="userSelect">
            <option value="" disabled selected>Select Users</option>
            <option *ngFor="let ulist of this.selectUserList" [value]="ulist.value">{{ ulist.name }}</option>
          </select>
        </div>

        <!-- Name Field -->
        <div class="mb-3">
          <label for="name">Name:</label>
          <input type="text" class="form-control" formControlName="Name" id="name">
        </div>

        <!-- Email Field -->
        <div class="mb-3">
          <label for="email">Email:</label>
          <input type="email" class="form-control" formControlName="Email" id="email">
        </div>

        <!-- Ethereum Address Field -->
        <div class="mb-3">
          <label for="ethAddress">EthAddress:</label>
          <input type="text" class="form-control" formControlName="EthAddress" id="ethAddress">
        </div>

        <!-- Balance Field -->
        <div class="mb-3">
          <label for="balance">Balance:</label>
          <input type="number" class="form-control" formControlName="Balance" id="balance">
        </div>

        <!-- Footer Buttons -->
        <div class="form-buttons">
          <button type="submit" class="btn btn-success">💾 Save</button>
          <button type="button" class="btn btn-danger" (click)="closePopup()">❌ Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
