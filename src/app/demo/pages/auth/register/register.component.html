<div class="auth-container">
  <div class="auth-form-container">
    <div class="auth-main">  
      <div class="auth-wrapper version-1">  
        <div class="auth-form">  
          <div class="auth-background">  
            <div class="yellow-circle"></div>  
            <div class="red-circle"></div>  
          </div>  
          <div class="main-form">  
            <app-card [showHeader]="false" class="auth-form-card" [padding]="40">  
              <h4 class="text-center m-b-25 f-20 f-w-500">Sign up with your work email.</h4>  
              <div class="row text-start">  
                <div class="col-md-6">  
                  <label class="f-w-500">First Name</label>  
                  <mat-form-field appearance="outline" class="w-100 m-t-5">  
                    <input type="text" matInput placeholder="First Name" [formControl]="firstName" />  
                    <mat-error *ngIf="firstName.invalid && (firstName.dirty || firstName.touched)">{{ getFirstNameError() }}</mat-error>  
                  </mat-form-field>  
                </div>  
                <div class="col-md-6">  
                  <label class="f-w-500">Last Name</label>  
                  <mat-form-field appearance="outline" class="w-100 m-t-5">  
                    <input type="text" matInput placeholder="Last Name" [formControl]="lastName" />  
                    <mat-error *ngIf="lastName.invalid && (lastName.dirty || lastName.touched)">{{ getLastNameError() }}</mat-error>  
                  </mat-form-field>  
                </div>  
                <div class="col-12">  
                  <label class="f-w-500">Enter Your Email</label>  
                  <mat-form-field appearance="outline" class="w-100 m-t-5">  
                    <input matInput placeholder="Email Address" [formControl]="email" />  
                    <mat-error *ngIf="email.invalid && (email.dirty || email.touched)">{{ getEmailError() }}</mat-error>  
                  </mat-form-field>  
                </div>  
                <div class="col-12">  
                  <label class="f-w-500">Enter your password</label>  
                  <mat-form-field appearance="outline" class="w-100 m-t-5">  
                    <input matInput [type]="hide ? 'password' : 'text'" placeholder="Enter your password" [formControl]="password" />  
                    <button mat-icon-button matSuffix (click)="hide = !hide">  
                      <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>  
                    </button>  
                    <mat-error *ngIf="password.invalid && (password.dirty || password.touched)">{{ getPasswordError() }}</mat-error>  
                  </mat-form-field>  
                </div>  
                <div class="col-12">  
                  <label class="f-w-500">Enter your Confirm Password</label>  
                  <mat-form-field appearance="outline" class="w-100 m-t-5">  
                    <input matInput [type]="coHide ? 'password' : 'text'" placeholder="Confirm your password" [formControl]="confirmPassword" />  
                    <button mat-icon-button matSuffix (click)="coHide = !coHide">  
                      <mat-icon>{{ coHide ? 'visibility_off' : 'visibility' }}</mat-icon>  
                    </button>  
                    <mat-error *ngIf="confirmPassword.invalid && (confirmPassword.dirty || confirmPassword.touched) || (confirmPassword.value !== password.value)">{{ getConfirmPasswordError() }}</mat-error>  
                  </mat-form-field>  
                </div>  
              </div>  
              <div class="check-me">  
                <mat-checkbox class="float-start" checked color="primary">I agree to all the Terms & Condition</mat-checkbox>  
              </div>  
              <div class="grid">  
                <button mat-flat-button color="primary" class="b-rad-20 m-t-15" (click)="register()">Register</button>  
              </div>  
              <div class="check-me m-t-15">  
                <h6 class="f-w-400 text-muted m-b-0">Already have an Account?</h6>  
                <a class="text-primary-500" [routerLink]="['/auth/login']">Login Account</a>  
              </div>  
            </app-card>  
          </div>  
        </div>  
      </div>  
    </div>
  </div>
  <div class="image-container">
    <img src="https://woopsacdn.blob.core.windows.net/weborder-images/customer-bg.webp" alt="Static Image" class="static-image" />
  </div>
</div>
